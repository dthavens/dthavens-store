<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Processing</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .success-card { background: white; padding: 40px; border-radius: 8px; text-align: center; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); max-width: 400px; }
        .icon { font-size: 50px; margin-bottom: 15px; }
        h1 { color: #2ecc71; margin-bottom: 10px; }
        p { color: #555; line-height: 1.6; }
        .btn-home { display: inline-block; background-color: #000; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; margin-top: 25px; font-weight: bold; }
        .btn-home:hover { background-color: #333; }
        .whatsapp-link { color: #25D366; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon">📱</div>
        <h1>Prompt Sent!</h1>
        <p>Please check your phone. An M-Pesa prompt has been sent to your Safaricom number.</p>
        <p>Enter your PIN to complete the payment for your shoes.</p>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <p style="font-size: 14px;">Didn't get the prompt? <br> 
        <a href="https://wa.me/254715227635?text=Hi!%20I%20didn't%20receive%20my%20M-Pesa%20prompt." class="whatsapp-link" target="_blank">Chat with us on WhatsApp</a></p>
        
        <a href="/" class="btn-home">Return to Store</a>
    </div>

</body>
</html>s
