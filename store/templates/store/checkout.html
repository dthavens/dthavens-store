<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - {{ shoe.name }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .checkout-box { background: white; padding: 30px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        .input-field { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-pay { width: 100%; background-color: #1b8500; color: white; padding: 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn-pay:hover { background-color: #146100; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #555; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #000; }
    </style>
</head>
<body>

    <div class="checkout-box">
        <h2 style="text-align: center; margin-top: 0;">Checkout: {{ shoe.name }}</h2>
        
        <div style="background-color: #e8f5e9; padding: 12px; border-radius: 5px; margin-bottom: 20px; text-align: center; border: 1px solid #4CAF50;">
            <p style="margin: 0; font-size: 18px; color: #2e7d32;"><strong>Confirmed Size:</strong> {{ selected_size }}</p>
        </div>
        
        <p style="text-align: center; font-size: 22px; font-weight: bold; color: #333;">Total: Ksh {{ shoe.price }}</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px;">
        
        <form method="POST" action="/checkout/{{ shoe.id }}/">
            {% csrf_token %}
            
            <input type="hidden" name="size" value="{{ selected_size }}">
            
            <label style="font-weight: bold; color: #333;">Full Name:</label>
            <input type="text" name="customer_name" class="input-field" placeholder="e.g. John Doe" required>

            <label style="font-weight: bold; color: #333;">Delivery Location:</label>
            <input type="text" name="delivery_address" class="input-field" placeholder="e.g. CBD, Nairobi" required>

            <label style="font-weight: bold; color: #333;">Safaricom Phone Number:</label>
            <input type="text" name="phone_number" class="input-field" placeholder="2547XXXXXXXX" required>
            
            <button type="submit" class="btn-pay">Pay Ksh {{ shoe.price }} via M-Pesa</button>
        </form>

        <a href="/" class="back-link">← Cancel and return to store</a>
    </div>

</body>
</html>
